name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.shell_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
            shell_name: "Powershell 7.x"
            shell_label: PS7
          - os: windows-2019
            shell: powershell
            shell_name: "Powershell 5.x"
            shell_label: PS5
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        shell: cmd
        run: |
          ${{ matrix.shell }} -Command "Write-Output $PSVersionTable; .\test\bin\init.ps1"
      - name: Execute Tests
        continue-on-error: true # Essential for aggregating results later
        shell: cmd
        run: |
          ${{ matrix.shell }} -Command ".\test\bin\test.ps1 -Coverage"
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.shell_label }}
          path: "**/junit.xml"
          if-no-files-found: error
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shell_label }}
          path: "test/out/coverage.xml"
          if-no-files-found: error

  report:
    name: Finalize Results
    needs: test
    runs-on: ubuntu-latest
    if: always()
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Download All Results
        uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: junit-results-*
      - name: Publish and Evaluate Test Report
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "all-results/**/junit.xml"
          detailed_summary: true
          include_passed: true
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
          check_name: "Pester Test Results"

# Unified CI workflow: remote-installs shortcuts via install.ps1 (no checkout),
# then runs the full test suite under PowerShell 7.x, then builds the documentation (and publishes it from develop).
# install.ps1 runs in powershell (5.1) to simulate a fresh machine; all tests run in pwsh (7.x).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: Tests (PowerShell 7.x)
    runs-on: windows-latest
    timeout-minutes: 60 # remote install + Scoop + coverage + Docker and Podman installs ran up to 29 min
    permissions:
      checks: write # publish test report as PR check
      pull-requests: write
      contents: read
    steps:
      - name: Remote install
        shell: powershell
        run: |
          # Snapshot PATH before install so we can detect new entries afterwards
          $pathBefore = $Env:Path
          $branch = "${{ github.head_ref || github.ref_name }}"
          $url = "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/$branch/bin/install.ps1"
          Write-Host "==> Fetching install.ps1 from: $url"
          Invoke-RestMethod $url -OutFile install.ps1
          Write-Host "==> Running install.ps1 with `"-Branch $branch -SkipAdminCheck`""
          .\install.ps1 -Branch $branch -SkipAdminCheck
          # Export PATH entries added by install (set-difference against pre-install snapshot)
          $before = $pathBefore -split ";" | Where-Object { $_ }
          $Env:Path -split ";" | Where-Object { $_ -and $_ -notin $before } |
              Out-File -FilePath $Env:GITHUB_PATH -Append -Encoding utf8
          # Export SHORTCUTS_DIR for later steps (test dependencies and test runner)
          "SHORTCUTS_DIR=$Env:USERPROFILE\shortcuts" | Out-File -FilePath $Env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "==> Debug: GITHUB_PATH content:"
          Get-Content $Env:GITHUB_PATH -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
          Write-Host "==> Debug: GITHUB_ENV content:"
          Get-Content $Env:GITHUB_ENV -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }

      - name: Scoop lib 5.1 smoke guard
        shell: powershell # Windows PowerShell 5.1 - enforces ADR 0001 (scoop/utils lib stay 5.1-compatible)
        run: |
          Set-Location $Env:SHORTCUTS_DIR; .\test\bin\smoke-ps51.ps1

      - name: Install test dependencies
        shell: pwsh
        run: |
          Set-Location $Env:SHORTCUTS_DIR; .\test\bin\init.ps1

      - name: Execute tests
        continue-on-error: true # let the report step decide pass/fail
        shell: pwsh
        run: |
          Set-Location $Env:SHORTCUTS_DIR; .\test\bin\testrunner.ps1 -Coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: "${{ env.SHORTCUTS_DIR }}/test/out/coverage.xml"
          flags: PS7
          token: ${{ secrets.CODECOV_TOKEN }}
          root_dir: "${{ env.SHORTCUTS_DIR }}"
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: "${{ env.SHORTCUTS_DIR }}/test/out/junit.xml"
          flags: PS7
          token: ${{ secrets.CODECOV_TOKEN }}
          root_dir: "${{ env.SHORTCUTS_DIR }}"
          report_type: test_results
          fail_ci_if_error: true

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "${{ env.SHORTCUTS_DIR }}/test/out/junit.xml"
          detailed_summary: true
          include_passed: false
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
          check_name: "Test Results (PowerShell 7.x)"

      - name: Upload the test report for the documentation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-report
          path: "${{ env.SHORTCUTS_DIR }}/test/out/junit.xml"
          if-no-files-found: error

  # The documentation (SC-073b) builds on the same OS as the tests, after them, and only when
  # they pass. Each job runs on a machine of its own, so the test job hands its JUnit report over
  # as an artifact, and the build links each result to its test (SC-073d); a missing report fails
  # the download. The build is `uv run poe docs`, the same command as locally; with -W, a warning
  # such as a link to a missing requirement fails it. A push to develop publishes the result to
  # GitHub Pages; a pull request only builds.
  docs:
    name: Documentation
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download the test report
        uses: actions/download-artifact@v8
        with:
          name: pester-report
          path: test/out

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install the documentation toolchain
        run: uv sync --locked

      - name: Build
        run: uv run poe docs

      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy-docs:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: docs
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

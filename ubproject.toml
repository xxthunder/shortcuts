"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

# The one needs configuration. ubCode and ubc read it directly, the Sphinx build through
# `needs_from_toml` in conf.py (SC-073b, after useblocks/SPLed).

[project]
name = "shortcuts"

# Configuring a parser puts ubCode in parser mode: the document set is this `include`, and
# it must equal `include_patterns` in conf.py, or ubCode reads documents Sphinx never builds.
[parse.parsers.md]
flavour = "myst"
include = [
  "docs/*.md",
  "docs/**/*.md",
]

[needs]
id_required = true
# Lowercase too: the deterministic IDs of test results are (SC-073d).
id_regex = "^[A-Za-z0-9_-]{6,}"
# The rules a missing or broken trace breaks (SC-073d, SC-073e); ubCode reads the same file.
schema_definitions_from_json = "schemas.json"

[needs.links.implements]
incoming = "is implemented by"
outgoing = "implements"

[needs.links.tests]
incoming = "is tested by"
outgoing = "tests"

# A Pester result links the test it resulted from: the test whose title, its Pester path,
# equals the result's case name (SC-073d).
[needs.links.result_of]
incoming = "has result"
outgoing = "result of"
derive = { kind = "links", join = { field = "title", equals = "case_name" }, where = "type == 'test'" }

# A result's outcome, ordered worst first, so that `min` gives the worst. "not run" sorts
# last: it is what a test holds of its own, and any result of the test outranks it (SC-073d).
[needs.fields.result]
nullable = true
schema = { type = "string", enum = ["failed", "error", "passed", "skipped", "disabled", "not run"] }

# A test's verdict: the worst of its results, "not run" with none. A requirement's: the
# worst verdict of its tests (SC-073d).
[needs.fields.verdict]
nullable = true
schema = { type = "string", enum = ["failed", "error", "passed", "skipped", "disabled", "not run"] }

[[needs.types]]
directive = "req"
title = "Requirement"
prefix = "REQ_"
color = "#BFD8D2"
style = "node"

[needs.types.fields.verdict]
derive = { kind = "min", field = "verdict", over = "tests_back", where = "type == 'test'" }

[[needs.types]]
directive = "impl"
title = "Implementation"
prefix = "IMPL_"
color = "#DF744A"
style = "node"

[[needs.types]]
directive = "test"
title = "Test"
prefix = "TEST_"
color = "#DCB239"
style = "node"

[needs.types.fields.result]
default = "not run"

[needs.types.fields.verdict]
derive = { kind = "min", field = "result", over = "result_of_back", transitive = true, include_self = true }

# The `src-trace` directive, so ubCode parses it as a known directive.
[parse.extend_directives.src-trace]
argument = false
options = true
content = false
content_required = false
parse_content = false
description = "Needs from codelinks markers in source code"
extension = "sphinx-codelinks"

# Codelinks markers in PowerShell (SC-073e): a `<# @need <type>: <title> ... @endneed #>` block
# above a function or a Pester `It`, with `:id:` and the requirements it implements or tests.
# Code and tests are two projects, so that the traces page renders them in sections of their own.
[codelinks]
set_remote_url = true

[codelinks.projects.px-proxy]
remote_url_pattern = "https://github.com/xxthunder/shortcuts/blob/{commit}/{path}#L{line}"

[codelinks.projects.px-proxy.source_discover]
src_dir = "tools/proxy"
include = ["px-proxy.ps1"]
comment_type = "powershell"

[codelinks.projects.px-proxy.analyse]
get_oneline_needs = false
get_need_id_refs = false
get_multiline_needs = true

[codelinks.projects.px-proxy-tests]
remote_url_pattern = "https://github.com/xxthunder/shortcuts/blob/{commit}/{path}#L{line}"

[codelinks.projects.px-proxy-tests.source_discover]
src_dir = "tools/proxy"
include = ["px-proxy.Tests.ps1"]
comment_type = "powershell"

[codelinks.projects.px-proxy-tests.analyse]
get_oneline_needs = false
get_need_id_refs = false
get_multiline_needs = true

# Pester results (SC-073d).
[test_reports]
deterministic_case_ids = true
